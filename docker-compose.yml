# Local development stack: Postgres and a HappyView container.
#
# Identity resolution uses the public PLC (`https://plc.directory`); the
# dashboard signs in with a real ATProto handle. There is no local PLC or PDS.
services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-happyview.sql:ro
    environment:
      POSTGRES_USER: bibliograph
      POSTGRES_PASSWORD: bibliograph
      POSTGRES_DB: bibliograph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliograph -d bibliograph"]
      interval: 5s
      timeout: 3s
      retries: 5

  happyview:
    image: ghcr.io/gamesgamesgamesgamesgames/happyview:2.17.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://happyview_app:happyview@postgres:5432/bibliograph
      PUBLIC_URL: http://127.0.0.1:3000
      BASE_PATH: /~/hv
      STATIC_DIR: /srv/static
      HOST: 0.0.0.0
      PORT: "3000"
      SESSION_SECRET: local-dev-session-secret-0123456789-0123456789-0123456789
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

volumes:
  pgdata:
  promdata:
