services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: bibliograph
      POSTGRES_PASSWORD: bibliograph
      POSTGRES_DB: bibliograph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliograph -d bibliograph"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata: