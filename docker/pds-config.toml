# tranquil-pds, local development. Ported from the HappyView e2e stack
# (scripts/e2e-config.toml) with this repo's database and blob paths.
#
# `hostname` sets the handle suffix: accounts are
# `alice.pds.127-0-0-1.sslip.io`. It cannot be a `.localhost` name — the handle
# spec reserves that TLD, so the PDS refuses to mint any account under it. Every
# `*.127-0-0-1.sslip.io` name resolves to 127.0.0.1 through public DNS, which is
# why the e2e stack names hosts the same way.

[server]
hostname = "pds.127-0-0-1.sslip.io"
allow_http_proxy = true
invite_code_required = false
disable_rate_limiting = true
disable_account_verification_gate = true

[database]
url = "postgres://bibliograph:bibliograph@postgres:5432/pds"

[storage]
path = "/var/lib/tranquil-pds/blobs"

[plc]
directory_url = "http://plc:2582"

# Every notification the PDS sends (password reset, email verification,
# welcome) is relayed to the Mailtrap Local container instead of resolving
# recipient MX records. PDS 0.7.1 has no SMTP-URL key: the smarthost is a
# host/port pair. The env equivalents are MAIL_FROM_ADDRESS, MAIL_FROM_NAME,
# MAIL_SMARTHOST_HOST, MAIL_SMARTHOST_PORT and MAIL_SMARTHOST_TLS.
# `from_address` is what enables email sending; Mailtrap accepts any sender and
# any recipient, so fixture addresses such as `seed-01@example.invalid` never
# leave the machine. Mailtrap Local needs no authentication and does not speak
# TLS, hence `tls = "none"` and no username/password (username and password
# must both be set or both be unset, and `none` plus a password is rejected at
# startup).
[email]
from_address = "noreply@pds.127-0-0-1.sslip.io"
from_name = "Bibliograph PDS"

[email.smarthost]
host = "mailtrap"
port = 3535
tls = "none"

[secrets]
allow_insecure = true
