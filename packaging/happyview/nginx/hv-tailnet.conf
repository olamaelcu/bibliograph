# HappyView dashboard/API at /hv — tailnet clients only, with one public
# exception: the OAuth client metadata document.
#
# EXAMPLE ONLY — the package installs this under
# /usr/share/bibliograph-happyview/nginx/ and never includes it from /etc/nginx.
# The listener address, backend port and host name below are the deployment's;
# activating it on another host is an operator action.
#
# This is a host-level snippet, not installed into sites-enabled by the package.
# Include it from the TLS server block of the tailnet vhost. On lescayes that is
# lescayes.ts.olamaelcu.net in /etc/nginx/conf.d/site-landing.conf:
#
#     include /etc/nginx/snippets/happyview-hv.conf;
#
# Tailnet clients resolve that name to 100.64.0.1 through MagicDNS and connect
# with a 100.64.0.0/10 source address. Public clients resolve it to
# 108.61.75.187 and are denied below. Nothing here trusts X-Forwarded-For:
# nginx is the first hop.
#
# PUBLIC_URL must be the bare origin (no /hv) and BASE_PATH=/hv, so HappyView
# serves this prefix and advertises
# https://<host>/hv/oauth-client-metadata.json as its OAuth client_id.
#
# The metadata document stays public because an atproto authorization server
# fetches it before and after the consent screen and cannot reach a tailnet
# address. It is public client metadata (redirect URIs, scopes, inline JWKS)
# and carries no secret. Its redirect_uri points at /hv/auth/callback, which is
# not public.
#
# /health is intentionally not exposed: HappyView always serves it at the origin
# root, which belongs to the landing site on this host. Probe
# http://127.0.0.1:3100/health locally instead.

# `return` runs in the rewrite phase, before access control, so these two
# redirects are reachable by anyone; the destination is not. No content is
# served here, and a public client that follows the redirect is denied below.
location = /hv {
    return 301 /hv/dashboard/;
}

location = /hv/ {
    return 301 /hv/dashboard/;
}

# Public by design: see the note above.
location = /hv/oauth-client-metadata.json {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_read_timeout 30s;
}

location /hv/ {
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    # The host's landing vhost includes nginx_bad_bots' 2 r/s bucket with
    # burst=10. A dashboard load opens dozens of asset requests at once, so use
    # the general flood bucket and a per-address connection ceiling a browser
    # cannot reach. Both directives are replaced here, not added to: nginx only
    # inherits them when the location defines none.
    limit_req  zone=flood burst=400 nodelay;
    limit_conn addr 400;

    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Procedures take small JSON bodies; blob upload is capped by HappyView.
    client_max_body_size 10m;
    proxy_read_timeout   120s;
    # Dashboard pages and JSON are small, but the asset stream should not be
    # held back by nginx buffering.
    proxy_buffering off;
}
