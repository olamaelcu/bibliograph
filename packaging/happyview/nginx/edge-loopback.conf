# EXAMPLE/TEMPLATE ONLY — the package installs this under
# /usr/share/bibliograph-happyview/nginx/ and never includes it from /etc/nginx.
# Activating it is an operator action; nothing in postinst or the units does.
#
# Loopback adapter between the SvelteKit edge and HappyView.
#
# HappyView routes dashboard and XRPC requests by Host to a registered domain.
# The edge talks to it over loopback, and once PUBLIC_URL is the tailnet origin,
# 127.0.0.1 is no longer a registered domain, so a plain loopback call answers
# 421 Unknown host. This listener is bound to 127.0.0.1 only and rewrites Host to
# the registered name, keeping the edge's upstream local.
#
# Copy to /etc/nginx/conf.d/bibliograph-happyview-loopback.conf, replace
# __HAPPYVIEW_DOMAIN__ with the host HappyView has registered as its primary
# domain (the PUBLIC_URL host), and point the edge's HAPPYVIEW_URL at
# http://127.0.0.1:3101/hv.
server {
    listen 127.0.0.1:3101;
    server_name _;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               __HAPPYVIEW_DOMAIN__;
        proxy_set_header X-Forwarded-Host   __HAPPYVIEW_DOMAIN__;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_read_timeout 120s;
    }
}
