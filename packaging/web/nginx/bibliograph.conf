# bibliograph-web — public vhost for the split edge package.
#
# Installed by bibliograph-web as a conffile at
# /etc/nginx/sites-available/bibliograph-web. It is staged, not enabled: the
# postinst symlinks it into sites-enabled only once a certificate for the name
# exists and `nginx -t` still accepts the result, because an enabled server
# block referencing a missing ssl_certificate makes `nginx -t` fail globally and
# keeps nginx from starting after a reboot — taking every other vhost on the
# host down with it.
#
# On lescayes.ts.olamaelcu.net, certbot runs with authenticator = webroot and
# webroot_path = /var/lib/certbot (see /etc/letsencrypt/renewal/). That host's
# other sites are /etc/nginx/conf.d/site-*.conf managed by the infra Ansible
# repository; this file deliberately stays in sites-available so dpkg and
# Ansible never write the same path.
#
# The upstream is the bibliograph-web unit, which binds HOST/PORT from
# /etc/bibliograph/web.env (127.0.0.1:5176). Keep the port below in sync with
# that conffile: drift makes every request fail with 502.
upstream bibliograph_web {
    server 127.0.0.1:5176;
}

server {
    listen      80;
    listen      [::]:80;
    server_name biblio.livtet.olamaelcu.net;

    # HTTP-01 challenge, matching webroot_path in the renewal config. Kept on
    # plain HTTP so renewal still works with an expired certificate.
    location /.well-known/acme-challenge/ {
        root /var/lib/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... ssl http2` and not `http2 on;`: the latter needs nginx
    # >= 1.25.1, and this host runs the Debian 12 build (1.22). The long form
    # still works on 1.25.1+ with a deprecation warning.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name biblio.livtet.olamaelcu.net;

    ssl_certificate     /etc/letsencrypt/live/biblio.livtet.olamaelcu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biblio.livtet.olamaelcu.net/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:bibliograph_web:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # The edge proxies the XRPC surface to HappyView, so uploads must reach the
    # app and get its own error rather than nginx's 413. nginx is the outer of
    # two limits: adapter-node enforces BODY_SIZE_LIMIT as well (512K unless
    # /etc/bibliograph/web.env raises it).
    client_max_body_size 100m;

    # Prometheus scrapes the web process directly on loopback
    # (127.0.0.1:5176/metrics). The public vhost must never serve that path:
    # metric names and label values are internal telemetry. The exact-match
    # location wins over `location /`, and denying here answers 403 without
    # proxying. Keep this before the catch-all location in spirit: nginx picks
    # the exact match first regardless of order.
    location = /metrics {
        allow 127.0.0.1;
        deny  all;
    }

    # Same log names the retired combined site used, so log review and
    # fail2ban/goaccess rules that name them keep working.
    access_log /var/log/nginx/bibliograph.access.log;
    error_log  /var/log/nginx/bibliograph.error.log;

    # The infra repository's nginx_bad_bots role installs /etc/nginx/bots.d and
    # the $loggable_request/$blocked_request maps that other vhosts include.
    # This package must stay loadable on a host without them, so the site ships
    # without those includes; on lescayes, add them the way the host's other
    # sites do:
    #
    #   include /etc/nginx/bots.d/blockbots.conf;
    #   include /etc/nginx/bots.d/ddos.conf;
    #   access_log /var/log/nginx/bibliograph.access.log combined if=$loggable_request;
    #   access_log /var/log/nginx/bibliograph.error.log blocked if=$blocked_request;

    location / {
        proxy_pass         http://bibliograph_web;
        proxy_http_version 1.1;
        # Ordinary HTTP: clearing Connection keeps the upstream connection
        # poolable instead of asking for an upgrade.
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # adapter-node can rebuild the public origin from these headers, but
        # only when PROTOCOL_HEADER/HOST_HEADER (or ORIGIN) are set in
        # /etc/bibliograph/web.env; the shipped conffile leaves them unset, so
        # absolute URLs the edge builds (redirects, docs examples) use http://
        # until the operator sets ORIGIN or the two header variables there.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # SvelteKit streams SSR output; buffering delays time to first byte.
        proxy_buffering off;
    }
}
