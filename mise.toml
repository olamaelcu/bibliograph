[tools]
node = "26.3.0"
pnpm = "11.13.1"

[env]
_.file = ".env"
DATABASE_URL = "postgres://bibliograph:bibliograph@localhost:5432/bibliograph"
# HappyView tables live in their own schema; keep DATABASE_URL public-only.
HAPPYVIEW_DATABASE_URL = "postgres://happyview_app:happyview@localhost:5432/bibliograph"
# Where the worker caches cover images and the edge serves them from. The
# packaged units get this from their conffiles (/var/cache/bibliograph-covers);
# local development keeps it inside the repo so nothing writes to /var/cache.
COVERS_CACHE_DIR = "{{config_root}}/.cache/covers"
# The feed generator identity: advertised by com.atproto.feed.describeFeedGenerator
# and the authority of every feed URI. Required — both feed methods answer 503
# without it. Local development must name a DID the private PLC resolves
# (`PLC_URL` in .env), and the local PDS serves no `/.well-known/did.json`, so a
# `did:web` value would name an identity nothing here can resolve: the
# deployment account is the local `did:plc`. Installed hosts set their own value
# in web.env (the production did:web).
FEED_GENERATOR_DID = "${HAPPYVIEW_ACCOUNT_DID}"
# The librarian queue, enabled locally against the provisional account that
# `mise run hv-account` creates: a real did:plc on the local PDS, so the sign-in
# goes through the same OAuth path production uses. Installed hosts seal both
# values in SOPS and Ansible writes /etc/bibliograph/librarian.env; the secret
# below is a development constant and must never leave this machine.
LIBRARIAN_DIDS = "${HAPPYVIEW_ACCOUNT_DID}"
LIBRARIAN_SESSION_SECRET = "dev-librarian-session-secret"

[tasks.sql]
description = "Open a psql shell against the local bibliograph database"
run = ["psql ${DATABASE_URL}"]

[tasks.worker-dev]
description = "Run the catalog worker, generating the labeler key first"
run = ["mise run worker"]

[tasks.web-dev]
description = "Bring up the local stack and run the edge on :5176 with the labeler key"
run = ["docker compose up -d", "mise run web"]

[tasks.dev]
run = ["mise run web-dev ::: worker-dev"]

[tasks.hv-test]
description = "Syntax-check and unit-test the HappyView Lua scripts"
run = ["happyview/test/run.sh"]

[tasks."test:web"]
description = "Run the SvelteKit edge's vitest suite (starts a throwaway Postgres with testcontainers; needs Docker)"
run = ["pnpm --filter web test"]

[tasks."test:worker"]
description = """
Run the catalog worker's vitest suite

Each run starts its own throwaway Postgres through testcontainers (needs
Docker), applies `packages/worker/sql/*.sql` to it, and the suite creates and
truncates its own rows — the development database named by `DATABASE_URL` is
never touched.
"""
run = ["pnpm --filter worker test"]

[tasks.test]
description = "Run every test tier: the edge's unit tests, the worker's suite and the HappyView scripts"
depends = ["test:web", "test:worker", "hv-test"]

[shell_alias]
sql = "mise sql"
