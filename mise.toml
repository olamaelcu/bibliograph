[tools]
node = "26.3.0"
pnpm = "11.13.1"

[env]
_.file = ".env"
DATABASE_URL = "postgres://bibliograph:bibliograph@localhost:5432/bibliograph"
# HappyView tables live in their own schema; keep DATABASE_URL public-only.
HAPPYVIEW_DATABASE_URL = "postgres://happyview_app:happyview@localhost:5432/bibliograph"
PLC_DIRECTORY_URL = "http://127.0.0.1:2582"

[tasks.web-dev]
run = ["pnpm run dev --host"]

[tasks.worker-dev]
run = ["pnpm run worker"]

[tasks.stack]
description = "Start the local Postgres + mock PLC + disposable PDS"
run = ["docker compose up --detach plc pds postgres"]

[tasks.mock-plc]
description = "Run the mock PLC directory alone (PORT=2582)"
run = ["pnpm --filter bibliograph-service mock-plc"]

[tasks.dev-seed]
description = "Create a local .test account on the dev PDS and write a shelf (no network account)"
run = ["pnpm --filter bibliograph-service dev:seed"]

[tasks.hv-extract]
description = "Extract the pinned HappyView image's binary/static/migrations into .cache/happyview"
run = ["pnpm --filter bibliograph-service hv:extract"]

[tasks.hv-dev-auth]
description = "Seed a local HappyView admin key and XRPC client (local DB only)"
run = ["pnpm --filter bibliograph-service hv:dev-auth"]

[tasks.hv-dev]
depends = ["hv-extract"]
description = "Run the extracted HappyView binary against HAPPYVIEW_DATABASE_URL"
run = ["pnpm --filter bibliograph-service hv:dev"]

[tasks.db-migrate]
run = ["pnpm run db:migrate"]

[tasks.hv-deploy]
description = "Upload lexicons/scripts to HappyView and apply activity indexes"
run = ["pnpm --filter bibliograph-service hv:deploy"]

[tasks.pds-publish-lexicons]
description = "Publish lexicons to the publisher PDS as com.atproto.lexicon.schema records"
run = ["pnpm --filter bibliograph-service pds:publish-lexicons"]

[tasks.dev]
description = "Migrate, start HappyView, seed local keys, deploy, then run worker + web"
run = [
  "docker compose up -d",
  "docker compose stop happyview",
  "pnpm --filter bibliograph-service dev:stack",
]

[tasks.worker]
description = "Run catalog enrichment and the PDS outbox publisher"
run = ["pnpm --filter bibliograph-service run worker"]

[tasks.sql]
description = "Open a psql shell against the local bibliograph database"
run = ["psql ${DATABASE_URL}"]

[tasks."backfill:covers"]
description = "Enqueue cover backfills for editions with no stored cover"
run = ["pnpm --filter bibliograph-service run backfill:covers"]

[tasks."backfill:descriptions"]
description = "Enqueue description backfills for editions with no description"
run = ["pnpm --filter bibliograph-service run backfill:descriptions"]

[tasks."backfill:formats"]
description = "Run the Goodreads format/pages/date backfill once"
run = ["pnpm --filter bibliograph-service run backfill:formats"]

[tasks."backfill:isbns"]
description = "Enqueue ISBN lookups for editions that have none"
run = ["pnpm --filter bibliograph-service run backfill:isbns"]

[tasks."backfill:requeue-isbns"]
description = "Re-enqueue ISBN lookups for editions stamped shadow/none/ambiguous"
run = ["pnpm --filter bibliograph-service run backfill:requeue-isbns"]

[shell_alias]
sql = "mise sql"
dev = "mise dev"
