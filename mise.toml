[tools]
node = "26.3.0"
pnpm = "11.13.1"

[env]
_.file = ".env"
DATABASE_URL = "postgres://bibliograph:bibliograph@localhost:5432/bibliograph"
# HappyView tables live in their own schema; keep DATABASE_URL public-only.
HAPPYVIEW_DATABASE_URL = "postgres://happyview_app:happyview@localhost:5432/bibliograph"

[tasks.sql]
description = "Open a psql shell against the local bibliograph database"
run = ["psql ${DATABASE_URL}"]

[tasks.worker-dev]
dir = "packages/worker"
run = ["pnpm run start"]

[tasks.web-dev]
dir = "packages/web"
run = ["docker compose up -d", "pnpm run dev"]

[tasks.dev]
run = ["mise run web-dev ::: worker-dev"]

[tasks.hv-test]
description = "Syntax-check and unit-test the HappyView Lua scripts"
run = ["happyview/test/run.sh"]

[shell_alias]
sql = "mise sql"
