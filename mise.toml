[tools]
node = "26.3.0"
pnpm = "11.13.1"

[env]
_.file = ".env"
DB_PATH = "data/bibliograph.db"

[tasks.dev]
run = "pnpm run dev"

[tasks.migrate]
run = "pnpm exec drizzle-kit migrate"

[tasks.import]
run = [
  "pnpm run dump:contributors --keep-dump --no-download",
  "pnpm run dump:works --keep-dump --no-download",
  "pnpm run dump:openlibrary --keep-dump --no-download",
  "pnpm run imaages:refresh --keep-dump --no-download",
]
