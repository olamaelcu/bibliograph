global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The worker's metrics server binds 127.0.0.1:9464 by default. Prometheus runs
  # in compose and reaches the host through host.docker.internal, so the
  # compose/dev worker must set WORKER_METRICS_HOST=0.0.0.0; a production host
  # can keep the loopback default and scrape it locally instead.
  - job_name: bibliograph-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: bibliograph-worker

  # The web edge serves /metrics on its loopback listener (5176). A dev/deploy
  # host reaches it through the compose bridge; the public vhost denies the
  # path, so the scrape must target the process directly.
  - job_name: bibliograph-web
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5176"]
        labels:
          service: bibliograph-web