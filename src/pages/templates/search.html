<style>
  .search-page {
    max-width: 60rem;
    margin: 0 auto;
    padding: 1.5rem 2rem 2rem;
  }

  .search-form {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1rem;
  }

  .search-form wa-input {
    flex: 1;
    min-width: 12rem;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .search-count {
    margin: 1.25rem 0 0.75rem;
  }

  .book-card {
    width: auto;
    margin: 0 0 0.75rem;
  }

  .book-card-header {
    display: flex;
    flex-direction: column;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .book-title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .book-id {
    font-family: var(--wa-font-family-code), monospace;
    font-size: 0.8rem;
    color: var(--wa-color-on-quiet);
    word-break: break-all;
  }

  .book-authors {
    margin: 0.25rem 0 0;
    color: var(--wa-color-on-quiet);
    font-size: 0.9rem;
  }

  .book-desc {
    margin: 0.5rem 0 0.75rem;
    font-size: 0.9rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .book-cover {
    width: 4rem;
    height: 6rem;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--wa-form-control-border-color);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
  }

  .no-covers {
    font-size: 0.85rem;
    color: var(--wa-color-on-quiet);
  }

  .load-more {
    text-align: center;
    margin: 1.25rem 0 0.5rem;
  }
</style>

<main class="search-page">
  <div class="page-intro" style="margin:0;padding:0">
    <h2>Search</h2>
    <p class="muted">
      Search the catalog for books and browse their contributors and covers.
      This page is a live client of the <code>community.lexicon.book.searchEditions</code> query
      served over <code>/xrpc</code>, backed by Google Books.
    </p>
  </div>
  <form id="search-form" class="search-form">
    <div class="search-bar">
      <wa-input id="search-q" placeholder="Search titles, descriptions, identifiers&hellip;" clearable></wa-input>
      <button id="search-btn" class="wa-brand">Search</button>
    </div>
  </form>
  <div id="results"></div>
</main>

<script type="module">
  const SEARCH_BOOKS = '/xrpc/community.lexicon.book.searchEditions';
  const PAGE_LIMIT = 20;

  const form = document.getElementById('search-form');
  const input = document.getElementById('search-q');
  const results = document.getElementById('results');

  let currentQuery = '';
  let currentCursor = null;

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function snippet(text, max) {
    const trimmed = String(text ?? '').trim();
    if (trimmed.length <= max) return trimmed;
    return trimmed.slice(0, max).trimEnd() + '&hellip;';
  }

  function renderCard(edition) {
    const authors = (edition.contributors ?? [])
      .map((c) => c.name ?? c.subject)
      .filter(Boolean)
      .join(', ');
    // Fetch cover via getImageForBook (separate XRPC; covers are not in the record).
    const coverHtml = edition.uri
      ? `<img class="book-cover" loading="lazy" data-cover-uri="${escapeHtml(edition.uri)}" alt="" />`
      : '<p class="no-covers">No cover.</p>';

    return `<wa-card class="book-card"><div slot="header" class="book-card-header">
          <h3 class="book-title">${escapeHtml(edition.title)}</h3>
          <span class="book-id">${escapeHtml(edition.uri)}</span>
        </div>
        <p class="book-authors">${authors ? `By ${escapeHtml(authors)}` : 'No contributors listed.'}</p>
        <p class="book-desc">${edition.description ? `${snippet(edition.description, 200)}` : 'No description.'}</p>
        ${coverHtml}
      </wa-card>`;
  }

  async function loadCovers() {
    const imgs = document.querySelectorAll('img[data-cover-uri]');
    for (const img of imgs) {
      const uri = img.getAttribute('data-cover-uri');
      if (!uri) continue;
      try {
        const res = await fetch(`/xrpc/net.olamaelcu.livtet.biblio.getImageForBook?uri=${encodeURIComponent(uri)}`);
        if (!res.ok) continue;
        const data = await res.json();
        if (data.url) img.src = data.url;
        else img.replaceWith(Object.assign(document.createElement('p'), { className: 'no-covers', textContent: 'No cover.' }));
      } catch {
        // leave the placeholder
      }
    }
  }

  async function runSearch(q) {
    currentQuery = q;
    currentCursor = null;
    const qs = new URLSearchParams({q, limit: String(PAGE_LIMIT)});
    const res = await fetch(`${SEARCH_BOOKS}?${qs}`, {headers: {accept: 'application/json'}});
    if (!res.ok) {
      results.innerHTML = `<p class="muted">Search failed (HTTP ${res.status}).</p>`;
      return;
    }
    const data = await res.json();
    currentCursor = data.cursor ?? null;
    const items = data.items ?? [];
    if (items.length === 0) {
      results.innerHTML = '<p class="muted">No editions matched your query.</p>';
      return;
    }
    const total = data.total != null ? ` of ${data.total.toLocaleString()}` : '';
    results.innerHTML = `<p class="muted search-count">${items.length}${total} editions found.</p>`;
    const cards = items.map((b) => renderCard(b));
    results.insertAdjacentHTML('beforeend', cards.join(''));
    loadCovers();
    appendLoadMore();
    history.replaceState(null, '', `?q=${encodeURIComponent(q)}`);
  }

  async function loadMore() {
    if (!currentCursor) return;
    const btn = document.getElementById('load-more-btn');
    if (btn) btn.loading = true;
    const qs = new URLSearchParams({q: currentQuery, limit: String(PAGE_LIMIT), cursor: currentCursor});
    const res = await fetch(`${SEARCH_BOOKS}?${qs}`, {headers: {accept: 'application/json'}});
    if (!res.ok) {
      if (btn) btn.loading = false;
      return;
    }
    const data = await res.json();
    currentCursor = data.cursor ?? null;
    const items = data.items ?? [];
    const cards = items.map((b) => renderCard(b));
    document.querySelector('.load-more')?.remove();
    results.insertAdjacentHTML('beforeend', cards.join(''));
    loadCovers();
    appendLoadMore();
    if (btn) btn.loading = false;
  }

  function appendLoadMore() {
    if (currentCursor) {
      results.insertAdjacentHTML('beforeend', '<div class="load-more"><wa-button id="load-more-btn">Load more</wa-button></div>');
      document.getElementById('load-more-btn').addEventListener('click', loadMore);
    } else {
      results.insertAdjacentHTML('beforeend', '<p class="muted load-more">End of results.</p>');
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    results.innerHTML = '<p class="muted">Searching&hellip;</p>';
    try {
      await runSearch(q);
    } catch {
      results.innerHTML = '<p class="muted">Search failed.</p>';
    }
  });

  const initial = new URLSearchParams(location.search).get('q');
  if (initial) {
    input.value = initial;
    runSearch(initial).catch(() => {
      results.innerHTML = '<p class="muted">Search failed.</p>';
    });
  }
</script>
